[package]
name = "hd-follow-shell"
version = "1.0.0"
description = "HD跟单系统 macOS desktop shell"
authors = ["HD Sports"]
edition = "2021"

[lib]
name = "hd_follow_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2.4.3"
